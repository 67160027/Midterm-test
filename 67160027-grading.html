<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Student Grade System</title>

  <style>
    /* ===== Layout ===== */
    body {
      font-family: Arial, sans-serif;
    }

    .container {
      display: flex;
      flex-direction: column;
      max-width: 600px;
      margin: 20px auto;
      gap: 10px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    label {
      width: 150px;
    }

    input {
      flex: 1;
      padding: 10px;
      border: 2px solid #ccc;
      border-radius: 5px;
    }

    input:focus {
      background-color: #f0f8ff;
      border-color: #007bff;
      outline: none;
    }

    .btn-group {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
    }

    button {
      padding: 10px 20px;
      border-radius: 5px;
      border: none;
      cursor: pointer;
    }

    #btn-calculate {
      background-color: #007bff;
      color: white;
    }

    #btn-clear {
      background-color: #6c757d;
      color: white;
    }

    /* ===== Result ===== */
    #result-container {
      display: none;
      background-color: #e6ffe6;
      border-left: 4px solid #28a745;
      padding: 15px;
      border-radius: 8px;
      margin-top: 15px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>Student Grade System</h2>

    <!-- Input Fields -->
    <div class="row">
      <label>Student Name</label>
      <input id="student-name" />
    </div>

    <div class="row">
      <label>Subject</label>
      <input id="subject-name" />
    </div>

    <div class="row">
      <label>Midterm</label>
      <input id="midterm-score" type="text" />
    </div>

    <div class="row">
      <label>Final</label>
      <input id="final-score" type="text" />
    </div>

    <div class="row">
      <label>Assignment</label>
      <input id="assignment-score" type="text" />
    </div>

    <!-- Buttons -->
    <div class="btn-group">
      <button id="btn-calculate">Calculate Grade</button>
      <button id="btn-clear">Clear</button>
    </div>

    <!-- Result Section -->
    <div id="result-container">
      <p>Total Score: <span id="total-score">0</span></p>
      <p>Final Grade: <span id="final-grade">-</span></p>
      <p>Status: <span id="pass-status">-</span></p>
    </div>

    <!-- Table -->
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Subject</th>
          <th>Total Score</th>
          <th>Grade</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>

  <script>
    /* ===== 2.1 Validate Score ===== */
    function validateScore(score) {
      if (score === "") return false;
      const num = Number(score);
      return !isNaN(num) && num >= 0 && num <= 100;
    }

    /* ===== 2.2 Calculate Score ===== */
    function calculateScore(midterm, final, assignment) {
      return (midterm * 0.2) + (final * 0.5) + (assignment * 0.3);
    }

    /* ===== 2.3 Get Grade ===== */
    function getGrade(score) {
      if (score >= 80) return "A";
      if (score >= 70) return "B";
      if (score >= 60) return "C";
      if (score >= 50) return "D";
      return "F";
    }

    /* ===== 2.4 Get Status ===== */
    function getStatus(grade) {
      return grade === "F" ? "FAIL" : "PASS";
    }

    /* ===== 2.5 Save to Storage ===== */
    function saveToStorage(data) {
      const oldData = loadFromStorage() || [];
      oldData.push(data);
      localStorage.setItem("studentData", JSON.stringify(oldData));
    }

    /* ===== 2.6 Load from Storage ===== */
    function loadFromStorage() {
      const data = localStorage.getItem("studentData");
      return data ? JSON.parse(data) : null;
    }

    /* ===== Helper: Render Table ===== */
    function renderTable(dataArray) {
      const tbody = document.getElementById("table-body");
      tbody.innerHTML = "";

      dataArray.map(item => {
        const row = `
          <tr>
            <td>${item.name}</td>
            <td>${item.subject}</td>
            <td>${item.score}</td>
            <td>${item.grade}</td>
            <td>${item.status}</td>
          </tr>
        `;
        tbody.innerHTML += row;
      });
    }

    /* ===== 2.7 Handle Calculate ===== */
    function handleCalculate() {
      const name = document.getElementById("student-name").value.trim();
      const subject = document.getElementById("subject-name").value.trim();
      const midterm = document.getElementById("midterm-score").value;
      const final = document.getElementById("final-score").value;
      const assignment = document.getElementById("assignment-score").value;

      if (!name || !subject) {
        alert("Please enter student name and subject");
        return;
      }

      if (
        !validateScore(midterm) ||
        !validateScore(final) ||
        !validateScore(assignment)
      ) {
        alert("All scores must be between 0-100");
        return;
      }

      const total = calculateScore(
        Number(midterm),
        Number(final),
        Number(assignment)
      );

      const grade = getGrade(total);
      const status = getStatus(grade);

      document.getElementById("result-container").style.display = "block";
      document.getElementById("total-score").textContent = total;
      document.getElementById("final-grade").textContent = grade;
      document.getElementById("pass-status").textContent = status;

      const data = { name, subject, midterm, final, assignment, score: total, grade, status };
      saveToStorage(data);
      renderTable(loadFromStorage());
    }

    /* ===== 2.8 Handle Clear ===== */
    function handleClear() {
      document.getElementById("student-name").value = "";
      document.getElementById("subject-name").value = "";
      document.getElementById("midterm-score").value = "";
      document.getElementById("final-score").value = "";
      document.getElementById("assignment-score").value = "";
      document.getElementById("result-container").style.display = "none";
    }

    /* ===== 2.9 Page Load ===== */
    window.addEventListener("DOMContentLoaded", () => {
      const data = loadFromStorage();
      if (data) {
        renderTable(data);
      }
    });

    /* ===== 2.10 Event Listener ===== */
    document.getElementById("btn-calculate")
      .addEventListener("click", handleCalculate);

    document.getElementById("btn-clear")
      .addEventListener("click", handleClear);
  </script>
</body>
</html>
